spring:
  application:
    name: plsql-visualizer
  main:
    # This is a run-once tool: it does one extraction and exits. Without this the
    # webmvc starter on the classpath would start a server and the process would
    # never come back. Set to `servlet` on the day a controller exists.
    web-application-type: none
    banner-mode: "off"
    # "Starting…/No active profile set/Started in 0.5s" is logged by a logger in
    # our own package, so raising root to warn does not silence it. This does,
    # without having to mute the package we may want to log from.
    log-startup-info: false

# Spring's own startup chatter would bury the extraction report, which is the
# thing a person actually reads here. Warnings and errors still come through.
logging:
  level:
    root: warn
    com.example.plsqlvisualizer: info

plsql:
  # extract  — read the schema, write a fresh IR
  # check    — report whether `ir` still matches the schema
  # refresh  — re-read only what changed and splice it into `ir`
  # trace    — overlay `trace-file` onto `ir`; needs no database
  task: extract

  # Library units to read from the dictionary. Empty reads the whole schema,
  # which means USER_IDENTIFIERS and USER_STATEMENTS are scanned end to end —
  # minutes, on a schema with thousands of objects, with no output until it ends.
  # Under the serve profile you do not need this at all: the page starts empty
  # and the search box names the unit per request.
  #
  # Names only; every object type carrying that name is included, so a package
  # brings both its spec and its body. From each name the scope also follows
  # `depth` call hops, and then the triggers standing on whatever all of that
  # writes — trigger writes appear in no procedure's own source, so leaving them
  # out would hide exactly what this tool exists to show.
  #
  #   units: [PKG_ORDER, PKG_POSITION]
  units: []

  # Call-graph hops to follow out from a named unit. 0 reads it alone, which
  # leaves every call out of it as a stub whose writes are invisible.
  depth: 2

  # Ceiling on how many units one scope may reach. A densely connected schema can
  # put most of itself within two hops of anything; that degrades into a
  # truncated graph, never into the schema-wide read scoping exists to avoid.
  max-units: 400

  # The schema to analyse, and the credentials to read it with. The extractor
  # connects AS the schema it inspects: the dictionary queries use USER_* views.
  # Env vars keep working, and keep the names the old CLI used.
  oracle:
    url: ${ORACLE_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${ORACLE_USER:tscope_test}
    password: ${ORACLE_PASSWORD:tscope}

  # The settings below are deliberately absent rather than written empty: a key
  # with no value binds to an empty string, not to null, which would read as a
  # real (blank) entry point or scenario name and defeat the defaults. Set them
  # here when you want a standing default, or per run on the command line.
  #
  #   entry: PKG_ORDER.SUBMIT   UNIT.SUBPROGRAM to walk from.
  #                             Absent walks every uncalled unit. NOTE this
  #                             prunes the finished graph — it does NOT make the
  #                             extraction cheaper. Every dictionary query has
  #                             already run by the time it applies. Use `units`
  #                             below for that.
  #
  #   out: target/ir.json       Where to write. Absent means the task chooses:
  #                             `extract` writes target/ir.json, while `refresh`
  #                             and `trace` rewrite their input in place. Setting
  #                             it makes the in-place tasks write a copy instead.
  #
  #   ir: target/ir.json        The existing IR that check / refresh / trace read.
  #
  #   trace-file: run.trc       The 10046 trace `trace` overlays onto `ir`.
  #   scenario: place_order     Recorded in meta.trace_source. Absent uses the
  #                             trace file's own name.

---
# ---------------------------------------------------------------------------
# Long-running service:  --spring.profiles.active=serve
#
#   GET  /?unit=PKG_ORDER   the renderer, carrying that unit's graph
#   GET  /                  the renderer, empty — the search box loads a unit
#   GET  /api/units?q=ORD   units whose name matches, for the search box
#   GET  /api/ir?unit=…     one unit's graph as JSON
#   POST /api/extract       read the WHOLE schema — minutes, on a large one
#   GET  /api/health        liveness, and what is currently held
#
# Nothing touches the dictionary until a unit is named. The page load that used
# to extract the entire schema is why this never started against a real database.
#
# There is no port in the default profile because nothing listens there: the
# default is a run-once tool that extracts and exits. Setting server.port
# without this profile configures a server that is never started.
# ---------------------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: serve
  main:
    web-application-type: servlet
  mvc:
    problemdetails:
      # The failures here are things a person has to act on — a mistyped unit
      # name, a database with no listener. Without this the client gets a bare
      # status code, and "ORA-12541: no listener" is the entire value of the
      # response. RFC 7807 puts it in `detail`.
      enabled: true

server:
  port: ${PORT:8080}

plsql:
  # Served by GET /, read per request so edits show up on reload. The IR is
  # injected into its <script id="ir-data"> block, so the page shows the live
  # schema rather than whatever fixture the file was saved with.
  renderer: samples/renderer.html

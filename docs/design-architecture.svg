<svg viewBox="0 0 680 732" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <style>
      text { fill:#1e293b; }
      .title { font-size:18px; font-weight:700; }
      .subtitle { font-size:11px; fill:#64748b; }
      .kicker { font-size:9px; font-weight:700; letter-spacing:1px; }
      .h { font-size:13px; font-weight:700; }
      .lbl { font-size:11.5px; fill:#334155; }
      .sub { font-size:10.5px; fill:#64748b; }
      .mono { font-family:ui-monospace,'SF Mono',Menlo,monospace; font-size:10px; fill:#334155; }
      .flag { fill:#be123c; font-weight:700; }
      .arw { fill:none; stroke:#64748b; stroke-width:1.5; }
      .arwlbl { font-size:9.5px; fill:#64748b; font-style:italic; }
      .box { stroke-width:1.5; }
      .opt { stroke-dasharray:6 4; }
      .c1 { fill:#eef2ff; stroke:#4f46e5; } .c1k { fill:#4f46e5; }
      .c2 { fill:#fef3c7; stroke:#b45309; } .c2k { fill:#b45309; }
      .cd { fill:#fffbeb; stroke:#d97706; } .cdk { fill:#d97706; }
      .c3 { fill:#ccfbf1; stroke:#0f766e; } .c3k { fill:#0f766e; }
      .c4 { fill:#f5f3ff; stroke:#7c3aed; } .c4k { fill:#7c3aed; }
      .c5 { fill:#d1fae5; stroke:#047857; } .c5k { fill:#047857; }
      .c6 { fill:#ffe4e6; stroke:#be123c; } .c6k { fill:#be123c; }
    </style>
  </defs>

  <text class="title" x="40" y="32">PL/SQL Data-Flow Visualizer — Kiến trúc</text>
  <text class="subtitle" x="40" y="50">Static (PL/Scope) = bản đồ toàn cục · Runtime trace = order thật · JSON IR chung → SVG renderer</text>

  <!-- Stage 1: source -->
  <rect class="box c1" x="180" y="70" width="320" height="60" rx="10"/>
  <text class="kicker c1k" x="198" y="88">SOURCE</text>
  <text class="h" x="198" y="105">Oracle 19c · Legacy packages (NEWFO)</text>
  <text class="sub" x="198" y="121">package procedures gọi nhau — cross-package</text>

  <path class="arw" d="M340 130 L340 156" marker-end="url(#arrow)"/>
  <text class="arwlbl" x="348" y="147">recompile ⟳</text>

  <!-- Stage 2: PL/Scope compile -->
  <rect class="box c2" x="160" y="158" width="360" height="60" rx="10"/>
  <text class="kicker c2k" x="178" y="176">PREP · chỉ trên DEV / TEST</text>
  <text class="h" x="178" y="193">Compile với PL/Scope</text>
  <text class="mono" x="178" y="209">PLSCOPE_SETTINGS='IDENTIFIERS:ALL, STATEMENTS:ALL'</text>
  <text class="sub" x="528" y="183">→ đổ vào</text>
  <text class="sub" x="528" y="197">dictionary</text>
  <text class="sub" x="528" y="211">(SYSAUX)</text>

  <path class="arw" d="M340 218 L340 238" marker-end="url(#arrow)"/>

  <!-- Stage 2b: dictionary substrate -->
  <rect class="box cd" x="100" y="240" width="480" height="46" rx="10"/>
  <text class="kicker cdk" x="118" y="258">DATA DICTIONARY · Oracle đã parse sẵn (không viết parser)</text>
  <text class="mono" x="118" y="277">ALL_STATEMENTS · ALL_IDENTIFIERS · ALL_DEPENDENCIES · ALL_SYNONYMS</text>

  <!-- distributor into two lanes -->
  <path class="arw" d="M340 286 L340 300"/>
  <path class="arw" d="M190 300 L500 300"/>
  <path class="arw" d="M190 300 L190 316" marker-end="url(#arrow)"/>
  <path class="arw" d="M500 300 L500 316" marker-end="url(#arrow)"/>

  <!-- Lane left: static extractor -->
  <rect class="box c3" x="40" y="318" width="300" height="150" rx="10"/>
  <text class="kicker c3k" x="58" y="338">STATIC EXTRACTOR · Java + JDBC</text>
  <text class="h" x="58" y="356">Thin — KHÔNG có parser</text>
  <text class="lbl" x="58" y="380">• Call graph <tspan class="mono">· IDENTIFIERS USAGE=CALL</tspan></text>
  <text class="lbl" x="58" y="399">• Writes <tspan class="mono">· STATEMENTS ⋈ IDENTIFIERS</tspan></text>
  <text class="lbl" x="58" y="418">• Resolve synonym / view → base table</text>
  <text class="lbl" x="58" y="437">• Build graph (JGraphT) + step no.</text>
  <text class="sub" x="58" y="458">= “đi những đâu” — superset, lexical order</text>

  <!-- Lane right: runtime trace (optional) -->
  <rect class="box c4 opt" x="360" y="318" width="280" height="150" rx="10"/>
  <text class="kicker c4k" x="378" y="338">RUNTIME TRACE · optional overlay</text>
  <text class="h" x="378" y="356">Cho order THẬT của 1 path</text>
  <text class="lbl" x="378" y="380">• event 10046 / DBMS_MONITOR</text>
  <text class="lbl" x="378" y="399">• DBMS_HPROF (call tree thật)</text>
  <text class="lbl" x="378" y="418">• chạy thật 1 luồng đại diện</text>
  <text class="sub" x="378" y="440">vd: đặt lệnh · settlement T+2</text>
  <text class="sub" x="378" y="458">= “lần này đã đi đâu” — order thật</text>

  <!-- converge into IR -->
  <path class="arw" d="M190 468 L340 481"/>
  <path class="arw" d="M500 468 L340 481"/>
  <path class="arw" d="M340 481 L340 496" marker-end="url(#arrow)"/>

  <!-- Stage 4: JSON IR -->
  <rect class="box c5" x="100" y="498" width="480" height="108" rx="10"/>
  <text class="kicker c5k" x="118" y="518">JSON IR · contract giữa extractor và renderer</text>
  <text class="lbl" x="118" y="539">nodes: <tspan class="mono">table / proc</tspan>   ·   edges: <tspan class="mono">call / write</tspan>  +  <tspan class="mono">step ordinal</tspan></text>
  <text class="lbl" x="118" y="561">confidence flag trên mỗi edge / node:</text>
  <text class="mono" x="118" y="579">resolved-static · <tspan class="flag">dynamic-unknown ⚑</tspan> · trigger-induced · branch-conditional</text>
  <text class="sub" x="118" y="598">Nguyên tắc: dynamic SQL &amp; trigger = blind spot → FLAG, không nuốt</text>

  <path class="arw" d="M340 606 L340 624" marker-end="url(#arrow)"/>

  <!-- Stage 5: renderer -->
  <rect class="box c6" x="120" y="626" width="440" height="74" rx="10"/>
  <text class="kicker c6k" x="138" y="646">SVG RENDERER · design system của bạn (680 · c-ramp · role color)</text>
  <text class="lbl" x="138" y="667">DAG: node = table · edge = data dependency</text>
  <text class="lbl" x="138" y="686">step-by-step reveal (slider / animation) theo step ordinal</text>

  <!-- legend -->
  <rect x="40" y="714" width="9" height="9" rx="2" class="c1"/><text class="sub" x="53" y="722">source</text>
  <rect x="128" y="714" width="9" height="9" rx="2" class="c2"/><text class="sub" x="141" y="722">prep</text>
  <rect x="216" y="714" width="9" height="9" rx="2" class="cd"/><text class="sub" x="229" y="722">dictionary</text>
  <rect x="304" y="714" width="9" height="9" rx="2" class="c3"/><text class="sub" x="317" y="722">static</text>
  <rect x="392" y="714" width="9" height="9" rx="2" class="c4"/><text class="sub" x="405" y="722">trace (opt)</text>
  <rect x="480" y="714" width="9" height="9" rx="2" class="c5"/><text class="sub" x="493" y="722">IR</text>
  <rect x="568" y="714" width="9" height="9" rx="2" class="c6"/><text class="sub" x="581" y="722">render</text>
</svg>

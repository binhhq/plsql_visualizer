<title>PL/SQL Data-Flow — step through the writes</title>
<style>
  :root {
    --ground: #ffffff;
    --chrome: #f8fafc;
    --hairline: #cbd5e1;
    --ink: #1e293b;
    --muted: #64748b;
    --dim: #94a3b8;

    /* Role ramps. Swap these values to re-skin; layout never references a hex. */
    --c-proc-fill: #ccfbf1;   --c-proc-stroke: #0f766e;   --c-proc-ink: #0f766e;
    --c-table-fill: #f1f5f9;  --c-table-stroke: #475569;  --c-table-ink: #475569;
    --c-alert-fill: #ffe4e6;  --c-alert-stroke: #be123c;  --c-alert-ink: #be123c;
    --c-trig: #94a3b8;
    --c-trace: #4f46e5;

    --focus: #0f766e;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #0b1220;
      --chrome: #111a2b;
      --hairline: #2b3a52;
      --ink: #e2e8f0;
      --muted: #94a3b8;
      --dim: #64748b;

      --c-proc-fill: #0d3b36;   --c-proc-stroke: #5eead4;  --c-proc-ink: #5eead4;
      --c-table-fill: #1c2739;  --c-table-stroke: #94a3b8; --c-table-ink: #cbd5e1;
      --c-alert-fill: #45111f;  --c-alert-stroke: #fda4af; --c-alert-ink: #fda4af;
      --c-trig: #64748b;
      --c-trace: #a5b4fc;

      --focus: #5eead4;
    }
  }

  /* The viewer's toggle must win over the OS preference in both directions. */
  :root[data-theme="light"] {
    --ground: #ffffff; --chrome: #f8fafc; --hairline: #cbd5e1;
    --ink: #1e293b; --muted: #64748b; --dim: #94a3b8;
    --c-proc-fill: #ccfbf1; --c-proc-stroke: #0f766e; --c-proc-ink: #0f766e;
    --c-table-fill: #f1f5f9; --c-table-stroke: #475569; --c-table-ink: #475569;
    --c-alert-fill: #ffe4e6; --c-alert-stroke: #be123c; --c-alert-ink: #be123c;
    --c-trig: #94a3b8; --c-trace: #4f46e5; --focus: #0f766e;
  }
  :root[data-theme="dark"] {
    --ground: #0b1220; --chrome: #111a2b; --hairline: #2b3a52;
    --ink: #e2e8f0; --muted: #94a3b8; --dim: #64748b;
    --c-proc-fill: #0d3b36; --c-proc-stroke: #5eead4; --c-proc-ink: #5eead4;
    --c-table-fill: #1c2739; --c-table-stroke: #94a3b8; --c-table-ink: #cbd5e1;
    --c-alert-fill: #45111f; --c-alert-stroke: #fda4af; --c-alert-ink: #fda4af;
    --c-trig: #64748b; --c-trace: #a5b4fc; --focus: #5eead4;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 13px;
    -webkit-font-smoothing: antialiased;
  }

  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  .tnum { font-variant-numeric: tabular-nums; }

  .shell {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* ---------------------------------------------------------- freshness */
  .freshness {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 7px 16px;
    background: var(--chrome);
    border-bottom: 1px solid var(--hairline);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 11px;
    color: var(--muted);
  }
  .freshness .sep { color: var(--hairline); }
  .freshness .ok { color: var(--c-proc-ink); font-weight: 600; }
  .freshness .none { color: var(--muted); }

  /* ------------------------------------------------------------ toolbar */
  .toolbar {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 10px 16px;
    border-bottom: 1px solid var(--hairline);
  }
  .wordmark {
    font-size: 13px; font-weight: 700; letter-spacing: .06em;
    color: var(--c-proc-ink); text-transform: uppercase;
  }
  .wordmark small {
    display: block; font-size: 9.5px; font-weight: 500; letter-spacing: .04em;
    color: var(--muted); text-transform: none; margin-top: 1px;
  }

  input[type="search"] {
    font: inherit; font-size: 11.5px;
    padding: 6px 9px; width: 170px;
    color: var(--ink); background: var(--ground);
    border: 1px solid var(--hairline); border-radius: 4px;
    outline: none;
  }
  input[type="search"]:focus-visible { border-color: var(--focus); box-shadow: 0 0 0 2px color-mix(in srgb, var(--focus) 30%, transparent); }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    font-size: 10.5px; padding: 4px 9px;
    border: 1px solid var(--hairline); border-radius: 999px;
    background: var(--ground); color: var(--muted);
    cursor: pointer; user-select: none;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  .chip:hover { border-color: var(--muted); }
  .chip[aria-pressed="true"] { color: var(--ground); border-color: transparent; font-weight: 600; }
  .chip.flag[aria-pressed="true"] { background: var(--c-alert-stroke); }
  .chip.trig[aria-pressed="true"] { background: var(--c-trig); }
  .chip.branch[aria-pressed="true"] { background: var(--c-table-stroke); }
  .chip:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .spacer { flex: 1 1 auto; }

  button.btn {
    font: inherit; font-size: 11px;
    padding: 6px 11px;
    border: 1px solid var(--hairline); border-radius: 4px;
    background: var(--ground); color: var(--ink);
    cursor: pointer;
  }
  button.btn:hover { border-color: var(--muted); }
  button.btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  button.btn[disabled] { opacity: .45; cursor: not-allowed; }

  /* --------------------------------------------------------------- body */
  .main { display: flex; flex: 1 1 auto; min-height: 0; align-items: stretch; flex-wrap: wrap; }

  .canvas {
    flex: 1 1 460px; min-width: 0; position: relative;
    background: var(--ground);
  }
  .canvas svg { display: block; width: 100%; height: auto; }

  .legend {
    position: absolute; left: 14px; bottom: 14px;
    background: color-mix(in srgb, var(--ground) 92%, transparent);
    border: 1px solid var(--hairline); border-radius: 6px;
    padding: 9px 12px; font-size: 10px; color: var(--muted); line-height: 1.75;
    pointer-events: none;
  }
  .legend h2 {
    margin: 0 0 4px; font-size: 9.5px; font-weight: 700;
    letter-spacing: .08em; color: var(--c-table-ink); text-transform: uppercase;
  }
  .legend .row { display: flex; align-items: center; gap: 6px; }

  /* ------------------------------------------------------------- detail */
  .detail {
    width: 320px; flex: 0 0 320px;
    border-left: 1px solid var(--hairline);
    background: var(--chrome);
    padding: 16px;
    overflow-y: auto;
  }
  .detail h2 {
    margin: 0 0 12px; font-size: 11px; font-weight: 700;
    letter-spacing: .08em; color: var(--c-proc-ink); text-transform: uppercase;
  }
  .field { margin-bottom: 11px; }
  .field .k {
    font-size: 9.5px; letter-spacing: .07em; color: var(--muted);
    text-transform: uppercase; margin-bottom: 2px;
  }
  .field .v { font-size: 12px; word-break: break-word; }
  .pair { display: flex; gap: 18px; }
  .oppill {
    display: inline-block; margin-bottom: 12px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 11px; font-weight: 700; letter-spacing: .04em;
    padding: 3px 9px; border-radius: 4px;
    border: 1px solid var(--hairline); background: var(--ground);
  }
  .oppill.flag { border-color: var(--c-alert-stroke); color: var(--c-alert-ink); background: var(--c-alert-fill); }
  .guardbox {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 11.5px; background: var(--ground);
    border: 1px solid var(--hairline); border-radius: 4px; padding: 6px 8px;
  }
  .empty { font-size: 12px; color: var(--muted); line-height: 1.65; }
  .note {
    margin-top: 14px; padding: 9px 10px;
    border-left: 2px solid var(--c-alert-stroke);
    background: var(--c-alert-fill);
    color: var(--c-alert-ink);
    font-size: 11px; line-height: 1.6;
  }

  /* ------------------------------------------------------------ scrubber */
  .scrubber {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 10px 16px;
    border-top: 1px solid var(--hairline);
    background: var(--chrome);
  }
  input[type="range"] { flex: 1 1 220px; max-width: 480px; accent-color: var(--c-proc-stroke); }
  input[type="range"]:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
  .counter {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 11px; min-width: 88px;
  }
  .segmented { display: flex; border: 1px solid var(--hairline); border-radius: 4px; overflow: hidden; }
  .segmented button {
    font: inherit; font-size: 10.5px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    padding: 5px 10px; border: 0; background: var(--ground);
    color: var(--muted); cursor: pointer;
  }
  .segmented button[aria-pressed="true"] { background: var(--c-proc-stroke); color: var(--ground); font-weight: 600; }
  .segmented button[disabled] { opacity: .45; cursor: not-allowed; }
  .caption { font-size: 10.5px; color: var(--muted); }

  /* ------------------------------------------------------------ graphics */
  .c-proc  { fill: var(--c-proc-fill);  stroke: var(--c-proc-stroke);  stroke-width: 1.5; }
  .c-table { fill: var(--c-table-fill); stroke: var(--c-table-stroke); stroke-width: 1.5; }
  .c-alert { fill: var(--c-alert-fill); stroke: var(--c-alert-stroke); stroke-width: 1.5; stroke-dasharray: 5 3; }
  /* A unit pulled in from outside the scoped package — shown, but recessive. */
  .c-outside { fill: var(--chrome); stroke: var(--dim); stroke-width: 1.5; }

  .e-write { stroke: var(--c-table-stroke); stroke-width: 1.6; fill: none; }
  .e-call  { stroke: var(--c-proc-stroke);  stroke-width: 1.6; fill: none; }
  .e-flag  { stroke: var(--c-alert-stroke); stroke-width: 2.2; fill: none; }
  .e-trig  { stroke: var(--c-trig); stroke-width: 1.5; fill: none; stroke-dasharray: 5 3; }

  .mk-write { fill: var(--c-table-stroke); }
  .mk-call  { fill: var(--c-proc-stroke); }
  .mk-flag  { fill: var(--c-alert-stroke); }
  .mk-trig  { fill: var(--c-trig); }

  .n-label   { font: 600 11.5px ui-sans-serif, system-ui, sans-serif; fill: var(--ink); }
  .n-kicker  { font: 9.5px ui-sans-serif, system-ui, sans-serif; fill: var(--muted); letter-spacing: .05em; }
  .n-alert   { font: 9px ui-monospace, "SF Mono", Menlo, monospace; fill: var(--c-alert-ink); }
  .e-badge   { font: 600 9.5px ui-monospace, "SF Mono", Menlo, monospace; fill: var(--ink); }
  .e-guard   { font: 9px ui-monospace, "SF Mono", Menlo, monospace; fill: var(--muted); }
  .e-tag     { font: italic 9.5px ui-sans-serif, system-ui, sans-serif; fill: var(--muted); }
  .e-loop    { font: 11px ui-monospace, "SF Mono", Menlo, monospace; fill: var(--ink); }
  .badge-bg  { fill: var(--ground); stroke: var(--hairline); stroke-width: 1; }

  .edge { cursor: pointer; }
  .edge .hit { stroke: transparent; stroke-width: 14; fill: none; }
  .node { cursor: pointer; }

  /* Reveal + emphasis. Opacity is the only thing that animates. */
  .hidden { opacity: 0; pointer-events: none; }
  .dimmed { opacity: .16; }
  .selected .e-write, .selected .e-call, .selected .e-flag, .selected .e-trig { stroke-width: 3.2; }
  .searchhit rect { stroke: var(--c-trace); stroke-width: 2.5; }

  .scope-chip {
    display: none; align-items: center; gap: 7px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 10.5px; padding: 4px 9px;
    border: 1px solid var(--c-proc-stroke); border-radius: 4px;
    color: var(--c-proc-ink); background: var(--c-proc-fill);
  }
  .scope-chip.on { display: inline-flex; }
  .scope-chip button {
    font: inherit; border: 0; background: none; cursor: pointer;
    color: inherit; padding: 0 0 0 2px; line-height: 1;
  }
  .scope-chip button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .canvas .noscope {
    position: absolute; inset: 0;
    display: none; align-items: center; justify-content: center;
    text-align: center; padding: 32px;
    font-size: 12.5px; color: var(--muted); line-height: 1.7;
  }
  .canvas.empty .noscope { display: flex; }

  .edge, .node { transition: opacity .28s ease; }
  @media (prefers-reduced-motion: reduce) {
    .edge, .node { transition: none; }
  }

  @media (max-width: 820px) {
    .detail { width: 100%; flex: 1 1 100%; border-left: 0; border-top: 1px solid var(--hairline); }
    .legend { display: none; }
  }
</style>

<div class="shell">
  <div class="freshness">
    <span>static: <span class="ok" id="fresh-static">fresh</span></span>
    <span class="sep">·</span>
    <span>trace: <span class="none" id="fresh-trace">none</span></span>
    <span class="sep">·</span>
    <span id="fresh-gen"></span>
  </div>

  <div class="toolbar">
    <div class="wordmark">
      PL/SQL Data-Flow
      <small id="entry-label"></small>
    </div>

    <input type="search" id="search" list="package-list" autocomplete="off"
           placeholder="filter by package…" aria-label="Filter the graph to a package" />
    <datalist id="package-list"></datalist>

    <span class="scope-chip" id="scope-chip">
      <span id="scope-text"></span>
      <button type="button" id="scope-clear" aria-label="Clear package filter">×</button>
    </span>

    <div class="chips" role="group" aria-label="Highlight by confidence">
      <button class="chip flag"   id="chip-dynamic" aria-pressed="false">dynamic-unknown</button>
      <button class="chip trig"   id="chip-trigger" aria-pressed="false">trigger-induced</button>
      <button class="chip branch" id="chip-branch"  aria-pressed="false">branch-conditional</button>
    </div>

    <span class="spacer"></span>
    <button class="btn" id="toggle-detail">Hide detail</button>
  </div>

  <div class="main">
    <div class="canvas">
      <svg id="graph" viewBox="0 0 680 520" role="img" aria-labelledby="graph-title">
        <title id="graph-title">Data-flow graph: program units and the tables they write</title>
        <defs>
          <marker id="ar-write" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth">
            <path class="mk-write" d="M0,0 L7.5,3 L0,6 Z" />
          </marker>
          <marker id="ar-call" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth">
            <path class="mk-call" d="M0,0 L7.5,3 L0,6 Z" />
          </marker>
          <marker id="ar-flag" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth">
            <path class="mk-flag" d="M0,0 L7.5,3 L0,6 Z" />
          </marker>
          <marker id="ar-trig" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth">
            <path class="mk-trig" d="M0,0 L7.5,3 L0,6 Z" />
          </marker>
        </defs>
        <g id="layer-edges"></g>
        <g id="layer-nodes"></g>
      </svg>

      <div class="noscope" id="noscope"></div>

      <div class="legend">
        <h2>Legend</h2>
        <div class="row"><svg width="14" height="10" aria-hidden="true"><rect width="14" height="10" rx="3" class="c-proc" /></svg> program unit</div>
        <div class="row"><svg width="14" height="10" aria-hidden="true"><rect width="14" height="10" rx="3" class="c-table" /></svg> table</div>
        <div class="row"><svg width="14" height="10" aria-hidden="true"><rect width="14" height="10" rx="3" class="c-alert" /></svg> unknown target</div>
        <div class="row"><svg width="16" height="8" aria-hidden="true"><line x1="0" y1="4" x2="16" y2="4" class="e-trig" /></svg> trigger-induced</div>
        <div class="row"><span class="mono">↻</span> runs in a loop</div>
      </div>
    </div>

    <aside class="detail" id="detail">
      <h2>Edge detail</h2>
      <div id="detail-body">
        <p class="empty">Select an edge to inspect its operation, confidence and provenance — or press play to step through the writes in order.</p>
      </div>
    </aside>
  </div>

  <div class="scrubber">
    <button class="btn mono" id="play" style="min-width:62px">▶ play</button>
    <input type="range" id="scrub" min="0" max="14" value="14" aria-label="Step through the data flow" />
    <div class="counter tnum" id="counter"></div>
    <div class="segmented" role="group" aria-label="Order edges by">
      <button id="order-static" aria-pressed="true">static</button>
      <button id="order-trace" aria-pressed="false" disabled title="No runtime trace in this IR">trace_order</button>
    </div>
    <span class="caption" id="scrub-note"></span>
  </div>
</div>

<script>
(function () {
  "use strict";

  var IR = JSON.parse(document.getElementById("ir-data").textContent);

  var SVG_NS = "http://www.w3.org/2000/svg";
  var COL_A_X = 34, PROC_W = 208, PROC_H = 46, PROC_GAP = 24;
  var COL_B_X = 468, TABLE_W = 158, TABLE_H = 42, TABLE_GAP = 22;
  var TOP = 34;

  var allEdges = IR.edges.slice().sort(function (a, b) { return (a.step || 0) - (b.step || 0); });
  var nodeById = {};
  IR.nodes.forEach(function (n) { nodeById[n.id] = n; });

  // Packages present, for the filter's autocomplete.
  var packages = [];
  IR.nodes.forEach(function (n) {
    if (n.kind === "program_unit" && n.unit && packages.indexOf(n.unit) === -1) packages.push(n.unit);
  });
  packages.sort();

  var dl = document.getElementById("package-list");
  packages.forEach(function (p) {
    var o = document.createElement("option");
    o.value = p;
    dl.appendChild(o);
  });
  document.getElementById("search").placeholder =
    "filter by package… e.g. " + (packages[0] || "PKG_ORDER");

  function unitOf(nodeId) {
    var n = nodeById[nodeId];
    return n && n.unit ? n.unit : null;
  }

  // ---------------------------------------------------------------- scope
  /**
   * The subgraph for a package query: what the package does, and what reaches
   * into it.
   *
   * Included deliberately:
   *  - every write and outbound call from the package's own subprograms
   *  - inbound calls, so "who calls this" is answerable without clearing the filter
   *  - trigger-induced writes fired by tables this package writes — these are
   *    consequences of the package's own DML, and hiding them would recreate
   *    exactly the blind spot the tool exists to remove
   */
  function computeScope(query) {
    if (!query) {
      return { edges: allEdges, inScope: null, matched: packages.slice() };
    }

    var q = query.toLowerCase();
    var matched = packages.filter(function (p) { return p.toLowerCase().indexOf(q) !== -1; });
    if (!matched.length) return { edges: [], inScope: [], matched: [] };

    var isMine = function (nodeId) {
      var u = unitOf(nodeId);
      return u != null && matched.indexOf(u) !== -1;
    };

    var picked = [];
    var writtenByMine = {};

    allEdges.forEach(function (e) {
      if (e.confidence === "trigger-induced") return;
      if (isMine(e.from)) {
        picked.push(e);
        if (e.type === "write") writtenByMine[e.to] = true;
      } else if (e.type === "call" && isMine(e.to)) {
        picked.push(e);
      }
    });

    allEdges.forEach(function (e) {
      if (e.confidence === "trigger-induced" && writtenByMine[e.from]) picked.push(e);
    });

    picked.sort(function (a, b) { return (a.step || 0) - (b.step || 0); });
    return { edges: picked, inScope: matched, matched: matched };
  }

  // --------------------------------------------------------------- layout
  var box = {};

  function layout(edges) {
    box = {};
    var firstTouch = {};
    edges.forEach(function (e) {
      if (!(e.from in firstTouch)) firstTouch[e.from] = e.step;
      if (!(e.to in firstTouch)) firstTouch[e.to] = e.step;
    });

    var ids = Object.keys(firstTouch);
    var byTouch = function (a, b) { return firstTouch[a] - firstTouch[b]; };

    var units = ids.filter(function (id) {
      return nodeById[id] && nodeById[id].kind === "program_unit";
    }).sort(byTouch);
    var stores = ids.filter(function (id) {
      return nodeById[id] && nodeById[id].kind !== "program_unit";
    }).sort(byTouch);

    units.forEach(function (id, i) {
      box[id] = { x: COL_A_X, y: TOP + i * (PROC_H + PROC_GAP), w: PROC_W, h: PROC_H, col: "A" };
    });
    stores.forEach(function (id, i) {
      box[id] = { x: COL_B_X, y: TOP + i * (TABLE_H + TABLE_GAP), w: TABLE_W, h: TABLE_H, col: "B" };
    });

    var height = Math.max(
      TOP + units.length * (PROC_H + PROC_GAP),
      TOP + stores.length * (TABLE_H + TABLE_GAP),
      120
    ) + 30;
    document.getElementById("graph").setAttribute("viewBox", "0 0 680 " + height);
  }

  // ---------------------------------------------------------------- roles
  function edgeRole(e) {
    if (e.confidence === "dynamic-unknown") return "flag";
    if (e.confidence === "trigger-induced") return "trig";
    return e.type === "call" ? "call" : "write";
  }
  var MARKER = { write: "ar-write", call: "ar-call", flag: "ar-flag", trig: "ar-trig" };

  function shortName(id) {
    if (id === "TBL:__UNKNOWN__") return "__UNKNOWN__";
    var body = id.replace(/^(PROC:|TBL:)/, "");
    var parts = body.split(".");
    return id.indexOf("PROC:") === 0 ? parts.slice(-2).join(".") : parts[parts.length - 1];
  }

  function pathFor(e) {
    var a = box[e.from], b = box[e.to];
    var ay = a.y + a.h / 2, by = b.y + b.h / 2;

    if (a.col === "A" && b.col === "B") {
      var x1 = a.x + a.w, x2 = b.x, mid = (x1 + x2) / 2;
      return { d: "M" + x1 + "," + ay + " C" + mid + "," + ay + " " + mid + "," + by + " " + x2 + "," + by,
               lx: mid, ly: (ay + by) / 2 };
    }
    if (a.col === "A" && b.col === "A") {
      var bx = a.x - 24;
      return { d: "M" + a.x + "," + ay + " C" + bx + "," + ay + " " + bx + "," + by + " " + b.x + "," + by,
               lx: a.x - 16, ly: (ay + by) / 2 };
    }
    var rx = b.x + b.w + 30;
    return { d: "M" + (a.x + a.w) + "," + ay + " C" + rx + "," + ay + " " + rx + "," + by + " " + (b.x + b.w) + "," + by,
             lx: b.x + b.w + 20, ly: (ay + by) / 2 };
  }

  function el(name, attrs) {
    var node = document.createElementNS(SVG_NS, name);
    for (var k in attrs) if (attrs[k] != null) node.setAttribute(k, attrs[k]);
    return node;
  }

  // ----------------------------------------------------------------- draw
  var layerNodes = document.getElementById("layer-nodes");
  var layerEdges = document.getElementById("layer-edges");
  var nodeEls = {}, edgeEls = {};

  function drawNodes(inScope) {
    layerNodes.textContent = "";
    nodeEls = {};

    Object.keys(box).forEach(function (id) {
      var n = nodeById[id];
      if (!n) return;
      var b = box[id];
      var outside = n.kind === "program_unit" && inScope && inScope.indexOf(n.unit) === -1;

      var g = el("g", { class: "node", tabindex: "0", role: "button" });
      var cls = n.kind === "program_unit"
        ? (outside ? "c-outside" : "c-proc")
        : (n.kind === "unknown" ? "c-alert" : "c-table");
      g.appendChild(el("rect", { x: b.x, y: b.y, width: b.w, height: b.h, rx: 10, class: cls }));

      var cx = b.x + b.w / 2;
      if (n.kind === "program_unit") {
        var k = el("text", { x: cx, y: b.y + 18, "text-anchor": "middle", class: "n-kicker" });
        k.textContent = outside ? n.unit + " · outside scope" : n.unit;
        g.appendChild(k);
        var t = el("text", { x: cx, y: b.y + 33, "text-anchor": "middle", class: "n-label" });
        t.textContent = n.subprogram;
        g.appendChild(t);
        g.setAttribute("aria-label", "Program unit " + n.unit + "." + n.subprogram
          + (outside ? ", outside the filtered package" : ""));
      } else if (n.kind === "unknown") {
        var u = el("text", { x: cx, y: b.y + 19, "text-anchor": "middle", class: "n-label" });
        u.textContent = "__UNKNOWN__";
        g.appendChild(u);
        var w = el("text", { x: cx, y: b.y + 32, "text-anchor": "middle", class: "n-alert" });
        w.textContent = "target not resolvable";
        g.appendChild(w);
        g.setAttribute("aria-label", "Unknown write target");
      } else {
        var tt = el("text", { x: cx, y: b.y + 26, "text-anchor": "middle", class: "n-label" });
        tt.textContent = n.name;
        g.appendChild(tt);
        g.setAttribute("aria-label", "Table " + n.name);
      }

      layerNodes.appendChild(g);
      nodeEls[id] = g;
    });
  }

  function drawEdges(edges) {
    layerEdges.textContent = "";
    edgeEls = {};

    edges.forEach(function (e) {
      if (!box[e.from] || !box[e.to]) return;
      var role = edgeRole(e);
      var p = pathFor(e);

      var g = el("g", { class: "edge", tabindex: "0", role: "button" });
      g.setAttribute("aria-label",
        "Step " + e.step + ": " + (e.op || "call") + " " + shortName(e.from) + " to " + shortName(e.to));

      g.appendChild(el("path", { d: p.d, class: "e-" + role, "marker-end": "url(#" + MARKER[role] + ")" }));
      g.appendChild(el("path", { d: p.d, class: "hit" }));

      if (e.op) {
        var wBadge = e.op.length * 6.4 + 12;
        g.appendChild(el("rect", { x: p.lx - wBadge / 2, y: p.ly - 8, width: wBadge, height: 16, rx: 3, class: "badge-bg" }));
        var badge = el("text", { x: p.lx, y: p.ly + 3.5, "text-anchor": "middle", class: "e-badge" });
        badge.textContent = e.op;
        g.appendChild(badge);
      }
      if (e.guard) {
        var gt = el("text", { x: p.lx, y: p.ly + 20, "text-anchor": "middle", class: "e-guard" });
        gt.textContent = e.guard.length > 30 ? e.guard.slice(0, 29) + "…" : e.guard;
        g.appendChild(gt);
      }
      if (e.reachability === "loop") {
        var lp = el("text", { x: p.lx, y: p.ly + 21, "text-anchor": "middle", class: "e-loop" });
        lp.textContent = "↻";
        g.appendChild(lp);
      }
      if (e.via_trigger) {
        var tg = el("text", { x: p.lx, y: p.ly + 19, "text-anchor": "middle", class: "e-tag" });
        tg.textContent = "via " + e.via_trigger;
        g.appendChild(tg);
      }

      layerEdges.appendChild(g);
      edgeEls[e.id] = g;
      bindEdge(e, g);
    });
  }

  // ---------------------------------------------------------------- state
  var state = { edges: allEdges, inScope: null, pos: 0, selected: null, playing: false, filters: {} };

  var scrub = document.getElementById("scrub");
  var canvas = document.querySelector(".canvas");

  function applyScope(query) {
    stop();
    var scope = computeScope(query);
    state.edges = scope.edges;
    state.inScope = scope.inScope;
    state.selected = null;

    var chip = document.getElementById("scope-chip");
    // A query that matches no package has inScope [] — truthy, but there is no
    // scope to name. The empty-state message below carries that case instead.
    if (scope.inScope && scope.matched.length) {
      chip.classList.add("on");
      document.getElementById("scope-text").textContent =
        "scope: " + scope.matched.join(", ") + " · " + scope.edges.length + " edges";
    } else {
      chip.classList.remove("on");
    }

    var empty = state.edges.length === 0;
    canvas.classList.toggle("empty", empty);
    if (empty) {
      document.getElementById("noscope").textContent =
        query ? 'No package matches "' + query + '". Packages in this IR: ' + packages.join(", ")
              : "This IR has no edges.";
      layerNodes.textContent = "";
      layerEdges.textContent = "";
      scrub.max = "0";
      scrub.value = "0";
      state.pos = 0;
      document.getElementById("counter").textContent = "step 0 / 0";
      document.getElementById("scrub-note").textContent = "";
      resetDetail();
      return;
    }

    layout(state.edges);
    drawNodes(state.inScope);
    drawEdges(state.edges);

    state.pos = state.edges.length;
    scrub.max = String(state.edges.length);
    scrub.value = String(state.pos);
    resetDetail();
    render();
  }

  function render() {
    var shown = {};
    var anyFilter = state.filters.dynamic || state.filters.trigger || state.filters.branch;

    state.edges.forEach(function (e, i) {
      var g = edgeEls[e.id];
      if (!g) return;
      var on = i < state.pos;
      g.classList.toggle("hidden", !on);
      if (on) { shown[e.from] = true; shown[e.to] = true; }

      var matches = !anyFilter
        || (state.filters.dynamic && e.confidence === "dynamic-unknown")
        || (state.filters.trigger && e.confidence === "trigger-induced")
        || (state.filters.branch && e.reachability === "branch-conditional");
      g.classList.toggle("dimmed", on && anyFilter && !matches);
      g.classList.toggle("selected", state.selected === e.id);
    });

    // Keep the first actor on screen before any edge has been revealed.
    if (state.edges.length) shown[state.edges[0].from] = true;

    Object.keys(nodeEls).forEach(function (id) {
      nodeEls[id].classList.toggle("hidden", !shown[id]);
    });

    document.getElementById("counter").textContent = "step " + state.pos + " / " + state.edges.length;

    var note = document.getElementById("scrub-note");
    var current = state.pos > 0 ? state.edges[state.pos - 1] : null;
    note.textContent = current
      ? shortName(current.from) + " → " + shortName(current.to)
        + (current.step != null ? "  (global step " + current.step + ")" : "")
      : "nothing has run yet";
  }

  // --------------------------------------------------------------- detail
  var CONFIDENCE_COPY = {
    "dynamic-unknown": "The target is built at runtime. It is not guessed here — this write happens, but to what, static analysis cannot say.",
    "trigger-induced": "This write is in no procedure's code. It happens because a trigger fires on the table it starts from."
  };

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c];
    });
  }

  function field(label, value) {
    if (value == null || value === "") return "";
    return '<div class="field"><div class="k">' + label + '</div><div class="v mono">' + esc(value) + "</div></div>";
  }

  function resetDetail() {
    document.getElementById("detail-body").innerHTML =
      '<p class="empty">Select an edge to inspect its operation, confidence and provenance — or press play to step through the writes in order.</p>';
  }

  function showDetail(e) {
    var flag = e.confidence === "dynamic-unknown";
    var html = "";

    html += '<div class="oppill' + (flag ? " flag" : "") + '">' + esc(e.op || "CALL") + "</div>";
    html += field("From", shortName(e.from));
    html += field("To", shortName(e.to));
    html += '<div class="pair">' + field("Step", e.step) + field("Line", e.line) + "</div>";
    html += field("SQL_ID", e.sql_id);
    html += field("Confidence", e.confidence);
    html += field("Resolved via", e.resolved_via);
    html += field("Reachability", e.reachability);

    if (e.guard) {
      html += '<div class="field"><div class="k">Guard</div><div class="guardbox">' + esc(e.guard) + "</div></div>";
    }
    if (e.via_trigger) html += field("Via trigger", e.via_trigger);
    if (e.raw_text) {
      html += '<div class="field"><div class="k">Raw statement</div><div class="guardbox">' + esc(e.raw_text) + "</div></div>";
    }
    html += field("Provenance", (e.provenance || []).join(" + "));
    if (e.trace_order != null) html += field("Trace order", e.trace_order);

    if (CONFIDENCE_COPY[e.confidence]) {
      html += '<div class="note">' + esc(CONFIDENCE_COPY[e.confidence]) + "</div>";
    }

    var unit = nodeById[e.from];
    var where = unit && unit.unit ? unit.unit + ":" + e.line : shortName(e.from) + ":" + e.line;
    html += '<button class="btn mono" id="copy-src" style="margin-top:10px" data-where="' + esc(where) + '">Copy ' + esc(where) + "</button>";

    document.getElementById("detail-body").innerHTML = html;

    var copy = document.getElementById("copy-src");
    if (copy) {
      copy.addEventListener("click", function () {
        var text = copy.getAttribute("data-where");
        var done = function () {
          copy.textContent = "Copied ✓";
          setTimeout(function () { copy.textContent = "Copy " + text; }, 1400);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(done, done);
        } else { done(); }
      });
    }
  }

  function bindEdge(e, g) {
    var pick = function () {
      state.selected = e.id;
      var idx = state.edges.indexOf(e);
      if (idx >= state.pos) { state.pos = idx + 1; scrub.value = String(state.pos); }
      showDetail(e);
      render();
    };
    g.addEventListener("click", pick);
    g.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); pick(); }
    });
  }

  // ------------------------------------------------------------ controls
  scrub.addEventListener("input", function () {
    state.pos = Number(scrub.value);
    stop();
    render();
  });

  var timer = null;
  var playBtn = document.getElementById("play");

  function stop() {
    if (timer) { clearInterval(timer); timer = null; }
    state.playing = false;
    playBtn.textContent = "▶ play";
  }

  playBtn.addEventListener("click", function () {
    if (state.playing) { stop(); return; }
    if (!state.edges.length) return;
    if (state.pos >= state.edges.length) { state.pos = 0; scrub.value = "0"; render(); }
    state.playing = true;
    playBtn.textContent = "❚❚ pause";
    timer = setInterval(function () {
      if (state.pos >= state.edges.length) { stop(); return; }
      state.pos += 1;
      scrub.value = String(state.pos);
      render();
    }, 780);
  });

  function chip(id, key) {
    var b = document.getElementById(id);
    b.addEventListener("click", function () {
      state.filters[key] = !state.filters[key];
      b.setAttribute("aria-pressed", state.filters[key] ? "true" : "false");
      render();
    });
  }
  chip("chip-dynamic", "dynamic");
  chip("chip-trigger", "trigger");
  chip("chip-branch", "branch");

  var search = document.getElementById("search");
  var debounce = null;
  search.addEventListener("input", function () {
    clearTimeout(debounce);
    var v = search.value.trim();
    debounce = setTimeout(function () { applyScope(v); }, 160);
  });

  document.getElementById("scope-clear").addEventListener("click", function () {
    search.value = "";
    applyScope("");
    search.focus();
  });

  var detailPanel = document.getElementById("detail");
  var detailBtn = document.getElementById("toggle-detail");
  detailBtn.addEventListener("click", function () {
    var hidden = detailPanel.style.display === "none";
    detailPanel.style.display = hidden ? "" : "none";
    detailBtn.textContent = hidden ? "Hide detail" : "Show detail";
  });

  // ---------------------------------------------------------- freshness
  var gen = IR.meta.static_source && IR.meta.static_source.generated_at;
  document.getElementById("fresh-gen").textContent =
    gen ? "extracted " + gen.replace("T", " ").replace(/\..*$/, "Z") : "";
  document.getElementById("entry-label").textContent =
    IR.meta.entry_point ? "entry " + IR.meta.entry_point : "all uncalled units";

  if (!allEdges.some(function (e) { return e.trace_order != null; })) {
    document.getElementById("fresh-trace").textContent = "none — static order is a superset";
  }

  applyScope("");
})();
</script>
